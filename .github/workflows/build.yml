name: Build and Package Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-package:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Ensure Target Directories Exist
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path "@Arma3VR/addons" -Force | Out-Null
        New-Item -ItemType Directory -Path "build" -Force | Out-Null

    - name: Setup MSVC Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup vcpkg and OpenXR
      run: |
        vcpkg install openxr-sdk-windows:x64-windows

    - name: Configure CMake
      run: |
        cmake -B build -S . -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

    - name: Compile Extension (Release)
      run: |
        cmake --build build --config Release

    - name: Pack PBO (Pure PowerShell, Zero-Dependency)
      shell: pwsh
      run: |
        $sourceDir = (Resolve-Path "@Arma3VR/addons/main").Path
        $pboPath   = "$PSScriptRoot/@Arma3VR/addons/main.pbo"
        
        Write-Host "Packing $sourceDir -> $pboPath"
        
        # Collect all files inside addons/main
        $files = Get-ChildItem -Path $sourceDir -Recurse -File
        
        $fs = [System.IO.File]::Create($pboPath)
        $bw = New-Object System.IO.BinaryWriter($fs)
        
        # 1. Write $PBOPREFIX$ header block
        $prefixBytes = [System.Text.Encoding]::ASCII.GetBytes("prefix`0main`0`0")
        $bw.Write([byte]0)                          # Empty filename
        $bw.Write([uint32]0x56657273)               # Magic: 'Vers' (0x56657273)
        $bw.Write([uint32]0)                        # Original size
        $bw.Write([uint32]0)                        # Reserved
        $bw.Write([uint32]0)                        # Timestamp
        $bw.Write([uint32]$prefixBytes.Length)      # Data size
        $bw.Write($prefixBytes)
        
        # 2. Write file header entries
        foreach ($file in $files) {
            $relPath = $file.FullName.Substring($sourceDir.Length + 1).Replace('/', '\')
            $relBytes = [System.Text.Encoding]::ASCII.GetBytes($relPath)
            
            $bw.Write($relBytes)
            $bw.Write([byte]0)                      # Null terminator
            $bw.Write([uint32]0)                    # Packing method (0 = uncompressed)
            $bw.Write([uint32]$file.Length)         # Original size
            $bw.Write([uint32]0)                    # Reserved
            $bw.Write([uint32]0)                    # Timestamp
            $bw.Write([uint32]$file.Length)         # Data size
        }
        
        # 3. Terminating empty header block
        $bw.Write([byte]0)
        $bw.Write(New-Object byte[] 20)
        
        # 4. Write file payload contents
        foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            $bw.Write($bytes)
        }
        
        $bw.Flush()
        $bw.Close()
        $fs.Close()
        Write-Host "PBO packed successfully without external tools!"

    - name: Prepare Clean Release Folder
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path "dist/@Arma3VR/addons" -Force | Out-Null
        Copy-Item "@Arma3VR/Arma3VR_x64.dll" -Destination "dist/@Arma3VR/"
        Copy-Item "@Arma3VR/openxr_loader.dll" -Destination "dist/@Arma3VR/"
        Copy-Item "@Arma3VR/mod.cpp" -Destination "dist/@Arma3VR/"
        Copy-Item "@Arma3VR/addons/main.pbo" -Destination "dist/@Arma3VR/addons/"

    - name: Upload Finished Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Arma3VR-PlugAndPlay
        path: dist/@Arma3VR

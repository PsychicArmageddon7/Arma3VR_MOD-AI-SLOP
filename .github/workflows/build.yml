name: Build Extension

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSVC Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup vcpkg and OpenXR
      run: |
        vcpkg install openxr-sdk-windows:x64-windows

    - name: Configure CMake
      run: |
        cmake -B build -S . -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

    - name: Build Release
      run: |
        cmake --build build --config Release

    - name: Upload Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Arma3VR-Release
        path: '@Arma3VR'
